[project]
name = "solarbess"
version = "0.1.0"
description = "Solar + Battery decision simulator with stochastic day-ahead / intraday optimisation under price and solar uncertainty."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyomo>=6.8,<7.0",
    "highspy>=1.7,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "plotly>=5.22,<6.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]
notebook = [
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.8,<4.0",
    "nbformat>=5.10,<6.0",
    "nbconvert>=7.16,<8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarbess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
